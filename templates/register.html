<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
</head>
<body>
    <div class="container">
        <h2>Форма реєстрації</h2>
        <form method="POST">
            <input type="text" name="name" placeholder="Введіть ваше ім'я" required><br>
            <input type="email" name="email" placeholder="Введіть ваш Email" required><br>
            <textarea name="message" rows="4" placeholder="Ваше повідомлення" required></textarea><br>
            <input type="submit" value="Відправити" class="btn">
        </form>
        <br>
        <a href="/" class="btn">Повернутися на головну</a>
    </div>
</body>
</html>
